x-app: &app
  build:
    context: .
  env_file:
    - ${BOT_ENV_FILE:-.env}
  environment:
    PYTHONPATH: /app/src

services:
  migrate:
    <<: *app
    command: ["uv", "run", "--no-sync", "alembic", "upgrade", "head"]
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  api:
    <<: *app
    command: ["uv", "run", "--no-sync", "uvicorn", "api.app:app", "--host", "0.0.0.0", "--port", "8000"]
    restart: unless-stopped
    expose:
      - "8000"
    depends_on:
      migrate:
        condition: service_completed_successfully

  caddy:
    image: caddy:2.8-alpine
    restart: unless-stopped
    environment:
      CADDY_SITE_ADDRESS: ${CADDY_SITE_ADDRESS:?CADDY_SITE_ADDRESS is required}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      api:
        condition: service_started

  bot: &bot
    <<: *app
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
      keydb:
        condition: service_healthy

  taskiq-worker:
    <<: *bot
    command:
      ["uv", "run", "--no-sync", "taskiq", "worker", "tskiq.broker:broker", "tskiq.tasks", "--workers", "1", "--max-fails", "1"]

  taskiq-scheduler:
    <<: *bot
    command:
      ["uv", "run", "--no-sync", "taskiq", "scheduler", "--skip-first-run", "tskiq.scheduler:scheduler", "tskiq.tasks"]

  db:
    image: postgres:15
    restart: unless-stopped
    user: postgres
    volumes:
      - db-data:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: ${BOT_POSTGRES__USER}
      POSTGRES_PASSWORD: ${BOT_POSTGRES__PASSWORD}
      POSTGRES_DB: ${BOT_POSTGRES__DB}
    expose:
      - 5432
    healthcheck:
      test: [ "CMD", "pg_isready" ]
      interval: 2s
      timeout: 3s
      retries: 20

  keydb:
    image: eqalpha/keydb
    restart: unless-stopped
    expose:
      - 6379
    volumes:
      - keydb-data:/data
    healthcheck:
      test: [ "CMD", "keydb-cli", "ping" ]
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  db-data:
  keydb-data:
  caddy-data:
  caddy-config:
